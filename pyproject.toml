[project]
name = "elecforecast"
version = "1.0.0"
description = "Time-series forecasting of monthly electric utility production, benchmarked against a seasonal-naive baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sahil Chakraborty" }]
keywords = ["time-series", "forecasting", "arima", "sarima", "statsmodels"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "plotly>=5.20",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
elecforecast = "elecforecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elecforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The app is mostly prose and Plotly trace definitions; wrapping those to 95
# columns hurts readability more than the long lines do.
"app/streamlit_app.py" = ["E501"]
